# Identical to diffusion_ec_embed.yaml (Setting A, the Table-2 configuration)
# except for the optimization seed. Everything else -- corpus, trainable
# modules, budget, batch size, LR, schedule -- is held fixed, so the spread
# across these runs isolates evaluator-training variance.
#
# Generation must be run with --seed 42 (fixed eval subset) and
# --latent_seed 42 (fixed sampling noise) for every one of these runs.

